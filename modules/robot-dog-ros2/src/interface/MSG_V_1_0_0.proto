syntax = "proto3";

option java_package = "com.hyzx.dispatchingsystem.common.proto";
option java_multiple_files = true;
import "google/protobuf/wrappers.proto";

//通用头字段
message MsgHead {
  google.protobuf.StringValue msgId = 1; //消息流水号
  google.protobuf.UInt64Value msgTime = 2; //消息生成时间(采集时间)，UTC时间，1970年1月1日以来毫秒数
}

message JoyMessage {
  MsgHead msgHead = 1;
  repeated double axes = 2;
  repeated uint32 buttons = 3;
}